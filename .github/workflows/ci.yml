name: QBLAS CI

on:
  push:
    branches: [main, overhaul-rewrite]
  pull_request:
  workflow_dispatch:

# We test on Ubuntu (gcc + clang) and macOS (clang), all matrix entries
# run the same: build SLEEF via scripts/bootstrap_sleef.sh, build qblas,
# run ctest.  No platform-specific behaviour is needed because both the
# bootstrap and the qblas CMake auto-detect cache sizes, ISA flags, and
# OpenMP at configure time.

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-14
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-15
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libomp-dev python3 python3-pip python3-venv
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang libomp-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja libomp python@3.12

      - name: Install numpy >= 2.0
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install 'numpy>=2.0'
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
          # Make cmake's find_package(Python3) prefer the venv on macOS,
          # where it otherwise picks the framework python without numpy.
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV

      - name: Build SLEEF with full SIMD coverage
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          bash scripts/bootstrap_sleef.sh

      - name: Configure qblas
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build qblas + tests + bench
        run: cmake --build build --parallel

      - name: Run correctness tests (C + Python-vs-numpy)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-run the benchmark (small problem sizes)
        run: |
          ./build/bench/qblas_bench --benchmark_min_time=0.05s \
            --benchmark_filter='BM_qdot/1024|BM_qaxpy/1024|BM_qgemm/64'

      - name: Force-test each dispatch tier (Linux only)
        if: runner.os == 'Linux'
        run: |
          for tier in generic sse2 avx2; do
            echo "==== Testing tier: $tier ===="
            QBLAS_DISPATCH=$tier ctest --test-dir build --output-on-failure
          done

  bench-baseline:
    # Run benchmarks on Linux gcc only and post results as an artifact for
    # tracking perf-regression over time.  Doesn't gate on pass/fail.
    name: benchmark / ubuntu-gcc
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libomp-dev

      - name: Build SLEEF
        run: bash scripts/bootstrap_sleef.sh

      - name: Build qblas
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          OMP_NUM_THREADS=$(nproc) OMP_PLACES=cores OMP_PROC_BIND=close \
              ./build/bench/qblas_bench_compare \
              --benchmark_min_time=0.2s \
              --benchmark_repetitions=3 \
              --benchmark_report_aggregates_only=true \
              --benchmark_format=json > bench-results/qblas_bench.json
          ./build/bench/qblas_bench_compare \
              --benchmark_min_time=0.2s \
              --benchmark_repetitions=3 \
              --benchmark_report_aggregates_only=true | tee bench-results/qblas_bench.txt

      - uses: actions/upload-artifact@v4
        with:
          name: qblas-bench-results
          path: bench-results/
          retention-days: 30
